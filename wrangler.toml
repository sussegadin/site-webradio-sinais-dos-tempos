name = "site-webradio-sinais-dos-tempos"
main = "server/worker/index.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_NAME = "Sinais dos Tempos Web Rádio"

[[d1_databases]]
binding = "DB"
database_name = "sinais-dos-tempos-db"
database_id = "COLOQUE_O_DATABASE_ID_AQUI"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sinais-dos-tempos-media"

[observability]
enabled = true

[assets]
directory = "./dist/public"
binding = "ASSETS"
