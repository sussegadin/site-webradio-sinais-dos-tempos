name: Post-deploy smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run public smoke tests
        env:
          BASE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: bash scripts/post-deploy-smoke.sh
